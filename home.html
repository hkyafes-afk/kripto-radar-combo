  const ch=(vals[n-1]/bars[0].o-1)*100;$("bc").innerHTML='<span class="'+(ch>=0?"up":"down")+'">'+sgn(ch,2)+"%</span> <span style='color:var(--mute)'>seçili aralıkta</span>"}
function btcTick(px){$("bp").textContent=F1.format(px);const l=bars[bars.length-1];if(l&&px>0){l.c=px;l.h=Math.max(l.h,px);l.l=Math.min(l.l,px);spark()}}
(function loop(){const t=TFS.find(x=>x[0]===tf);loadBars().finally(()=>setTimeout(loop,t?t[2]:15000))})();
/* ---------- işlemler ---------- */
let fSig="";
function fills(s){
  const fs=[...(s.fills||[])].sort((a,b)=>num(b.ts_ms)-num(a.ts_ms)).slice(0,12);$("fc").textContent=(s.fills||[]).length+" toplam";
  const sig=fs.map(f=>f.order_id).join();if(sig===fSig)return;const first=fSig==="";fSig=sig;
  const box=$("fl");box.textContent="";
  if(!fs.length){box.innerHTML="<div style='color:var(--mute);font-size:13px'>Henüz işlem yok.</div>";return}
  fs.forEach(f=>{const buy=f.side==="buy",c=document.createElement("div");c.className="ch";c.style.setProperty("--c",buy?"#F2B544":"#3CCFAE");
    const d=new Date(num(f.ts_ms));
    c.innerHTML="<i>"+(buy?"▲ ALIŞ":"▼ SATIŞ")+"</i><b>"+F1.format(num(f.price))+"</b><small>"+d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})+" · "+num(f.qty)+" BTC</small>";box.appendChild(c)});
  if(!first)burst(buy0(fs[0]))}
const buy0=f=>f.side==="buy"?"#F2B544":"#3CCFAE";
/* ---------- döngü ---------- */
function valid(s){return s&&s.schema_version===1&&s.execution_mode==="PAPER_ONLY"&&s.symbol==="BTC-USDT-SWAP"&&s.private_api_enabled===false&&s.live_order_submission===false&&s.paper&&s.config&&s.market}
function render(s,src){
  const P=s.paper,cap=num(P.capital_usdt)||200,eq=num(P.equity_usdt),px=num(s.market.last),tot=eq-cap;
  const age=Math.max(0,(Date.now()-num(s.generated_at_ms))/1000),halt=!!P.halted,feed=!!(s.feed&&s.feed.feed&&s.feed.feed.healthy);
  const st=$("st");st.className="st "+((halt||age>300||!feed)?"bad":"ok");
  $("stt").textContent=halt?"Motor durdu ("+(P.halt_reason||"")+")":age>300?"Veri gecikmiş":!feed?"Fiyat akışı kesik":"Motor çalışıyor";
  $("age").textContent=F1.format(age)+" sn · "+src;
  tw($("eq"),eq,F2.format.bind(F2),$("eq").closest(".v"));
  const dl=$("dl");dl.className="d mono "+(tot>=0?"up":"down");dl.textContent=sgn(tot)+" USDT · "+sgn(tot/cap*100)+"%";
  $("pp").textContent="BTC "+F1.format(px);
  const C=s.config,stop=num(C.hard_stop_price)||num(C.low_price)*.99,fr=num(P.free_margin_ratio);
  gauge("g1",(eq-cap)/cap,F0.format(Math.max(0,(eq-cap)/cap*100))+"%");
  gauge("g2",fr,F0.format(fr*100)+"%");
  const sd=px>0&&stop>0?(px/stop-1):0;gauge("g3",sd/.12,"%"+F1.format(sd*100));
  reactor(s);fills(s);btcTick(px);
  $("ft").textContent="PAPER · gerçek emir yok · kaynak: "+src+" · "+new Date(num(s.generated_at_ms)).toLocaleTimeString("tr-TR")}
function offline(m){$("st").className="st bad";$("stt").textContent=m}
async function load(){let s=null,src="";
  try{const r=await fetch(LIVE_URL+"?v="+Date.now(),{cache:"no-store",signal:AbortSignal.timeout(3500)});if(!r.ok)throw 0;s=await r.json();src="sunucu"}
  catch(_){try{const r=await fetch(STATE_URL+"?v="+Date.now(),{cache:"no-store",signal:AbortSignal.timeout(6000)});if(!r.ok)throw 0;s=await r.json();src="GitHub"}catch(__){s=null}}
  if(!valid(s)){offline("Veri alınamıyor");setTimeout(load,3000);return}
  try{render(s,src)}catch(e){offline("Gösterim hatası")}
  setTimeout(load,src==="sunucu"?1000:5000)}
load();

(function(){const w=$("rxw"),r=$("rx");if(RM)return;
  const mv=e=>{const b=w.getBoundingClientRect(),x=((e.touches?e.touches[0].clientX:e.clientX)-b.left)/b.width-.5,y=((e.touches?e.touches[0].clientY:e.clientY)-b.top)/b.height-.5;r.style.transform=`rotateY(${x*14}deg) rotateX(${-y*14}deg)`};
  w.addEventListener("pointermove",mv);w.addEventListener("touchmove",mv,{passive:true});["pointerleave","touchend"].forEach(n=>w.addEventListener(n,()=>r.style.transform=""))})();
</script>
